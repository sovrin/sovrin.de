<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The site's wall in 1200x630: the photo's yellow with the photo multiplied
     onto it and the name in ink, beside the dark column with the about line.
     Colours are the site's (main.css --wall / --wall-ink at hue 86, aequitas'
     dark --ae-bg) written out as hex. scripts/og.sh injects the Geist faces from
     aequitas' dist and a <base> at the repo root, so the photo path below
     resolves; text in .name / .about / .domain is replaced from app.config.ts. */
  :root { --wall:#f7be1c; --ink:#130f06; --bg:#0b0906; --fg:#f2efe9; --muted:#b3ada3; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  .card { display:grid; grid-template-columns:458px 1fr; width:1200px; height:630px;
          font-family:'Geist', system-ui, sans-serif; color:var(--fg); }
  .wall { display:grid; grid-template-rows:1fr auto; overflow:hidden; background:var(--wall); }
  .wall img { width:100%; height:100%; min-height:0; object-fit:cover; object-position:42% 62%;
              filter:grayscale(1) contrast(1.15); mix-blend-mode:multiply; }
  .name { padding:28px 40px 40px; font-size:68px; font-weight:700; letter-spacing:-.055em;
          line-height:.92; color:var(--ink); }
  .side { display:grid; align-content:space-between; padding:64px 64px 52px; }
  .about { font-size:36px; line-height:1.32; letter-spacing:-.015em; color:var(--muted); }
  .domain { font-family:'Geist Mono', ui-monospace, monospace; font-size:24px; color:var(--wall); }
</style>
</head>
<body>
  <div class="card">
    <div class="wall">
      <img src="app/assets/me.jpg" alt="">
      <div class="name">Oleg Kamlowski</div>
    </div>
    <div class="side">
      <div class="about">Senior software engineer at Thomann.io. In my own time I build small, sharp tools.</div>
      <div class="domain">sovrin.de</div>
    </div>
  </div>
</body>
</html>
