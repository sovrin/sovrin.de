<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  :root { --bg:#060606; --fg:#f5f5f5; --mesh:#b5842a; }
  * { margin:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  .card { position:relative; width:1200px; height:630px; overflow:hidden;
          font-family:'Space Grotesk',sans-serif; color:var(--fg); }
  .mesh { position:absolute; inset:0; color:var(--mesh);
          background:radial-gradient(126% 114% at 74% 30%,
            color-mix(in oklab, currentColor 15%, transparent) 0%,
            color-mix(in oklab, currentColor 5%, transparent) 45%, transparent 72%);
          -webkit-mask:radial-gradient(135% 130% at 74% 30%, #000 52%, rgba(0,0,0,.3) 86%, rgba(0,0,0,.1) 100%);
          mask:radial-gradient(135% 130% at 74% 30%, #000 52%, rgba(0,0,0,.3) 86%, rgba(0,0,0,.1) 100%); }
  .mesh svg { width:100%; height:100%; display:block; }
  .blur { position:absolute; inset:0; backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px);
          -webkit-mask:radial-gradient(86% 90% at 0% 108%, #000 0%, #000 40%, transparent 86%);
          mask:radial-gradient(86% 90% at 0% 108%, #000 0%, #000 40%, transparent 86%); }
  .content { position:absolute; left:76px; bottom:64px; z-index:2; }
  .status { font-family:'JetBrains Mono',monospace; font-size:19px; letter-spacing:.08em;
            color:rgba(245,245,245,.5); margin-bottom:18px; }
  .status .sig { color:var(--mesh); margin-right:.5em; }
  .name { font-size:132px; font-weight:500; letter-spacing:-.03em; line-height:.9; }
  .phrase { font-size:26px; color:rgba(245,245,245,.6); margin-top:10px; }
  .domain { position:absolute; right:76px; bottom:66px; z-index:2;
            font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.16em;
            color:rgba(245,245,245,.32); }
</style>
</head>
<body>
  <div class="card">
    <div class="mesh" id="mesh"></div>
    <div class="blur"></div>
    <div class="content">
      <div class="status"><span class="sig">$</span>whoami</div>
      <div class="name">sovrin</div>
      <div class="phrase">building things on the web</div>
    </div>
    <div class="domain">sovrin.de</div>
  </div>
<script>
  // Tuning dials are INJECTED by scripts/og.sh from app/utils/mesh-constants.mjs —
  // the same file the site's canvas reads, so this card cannot drift from it.
  // Opening this file directly in a browser will (deliberately) fail here.
  const M = window.__MESH__;
  if (!M) throw new Error('mesh constants missing: render via scripts/og.sh, not by opening this file');
  const PHI=M.PHI, COLS=M.COLS, ROWS=M.ROWS, CELL=M.CELL, W=COLS*CELL, H=ROWS*CELL, J=CELL/(PHI*PHI);
  const FU=M.FU, FV=M.FV, FX=FU*W, FY=FV*H;
  let Lx=M.LIGHT[0], Ly=M.LIGHT[1], Lz=M.LIGHT[2]; const Ll=Math.hypot(Lx,Ly,Lz); Lx/=Ll; Ly/=Ll; Lz/=Ll;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const AMP_SWELL=M.AMP_SWELL, AMP_FOLD=M.AMP_FOLD, AMP_JITTER=M.AMP_JITTER, SIGMA=M.SIGMA, FLOOR=M.FLOOR;
  const relief=(u,v)=>{ const t=(u+(1-v))/2; const s=Math.min(1,Math.max(0,(t-M.RELIEF_START)/M.RELIEF_SPAN)); const sm=s*s*(3-2*s); return FLOOR+(1-FLOOR)*sm; };
  const pts=[];
  for(let r=0;r<=ROWS;r++){ const row=[]; for(let c=0;c<=COLS;c++){
    const edge=r===0||c===0||r===ROWS||c===COLS;
    const x=c*CELL+(edge?0:rand(-J,J)), y=r*CELL+(edge?0:rand(-J,J));
    const u=x/W, v=y/H, rel=relief(u,v);
    const swell=AMP_SWELL*Math.exp(-(((u-FU)**2)+((v-FV)**2))/(2*SIGMA*SIGMA));
    const fold=AMP_FOLD*Math.sin(u*Math.PI*M.FOLD_U_FREQ+M.FOLD_U_PHASE)*Math.cos(v*Math.PI*M.FOLD_V_FREQ+M.FOLD_V_PHASE);
    row.push({x,y,z:swell+rel*fold+rel*rand(-AMP_JITTER,AMP_JITTER)}); } pts.push(row); }
  const poly=(a,b,c)=>`${a.x.toFixed(1)},${a.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)}`;
  const cross2=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  const lambert=(a,b,c)=>{ const ux=b.x-a.x,uy=b.y-a.y,uz=b.z-a.z,vx=c.x-a.x,vy=c.y-a.y,vz=c.z-a.z;
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
    if(nz<0){nx=-nx;ny=-ny;nz=-nz} return Math.max(0,nx*Lx+ny*Ly+nz*Lz); };
  const HD=Math.hypot(0.5,0.5), DITHER=0.012; let inner='';
  for(let r=0;r<ROWS;r++){ for(let c=0;c<COLS;c++){
    const tl=pts[r][c],tr=pts[r][c+1],bl=pts[r+1][c],br=pts[r+1][c+1];
    const acOk=cross2(tl,br,tr)*cross2(tl,br,bl)<0, bdOk=cross2(tr,bl,tl)*cross2(tr,bl,br)<0;
    const useAC=acOk&&bdOk?Math.random()>0.5:acOk;
    const tris=useAC?[[tl,tr,br],[tl,br,bl]]:[[tl,tr,bl],[tr,br,bl]];
    for(const [a,b,cc] of tris){ const lam=lambert(a,b,cc);
      const cx=(a.x+b.x+cc.x)/3, cy=(a.y+b.y+cc.y)/3;
      const dist=Math.hypot((cx-FX)/W,(cy-FY)/H)/HD;
      const falloff=M.FALL_BASE+M.FALL_RANGE*Math.pow(1/PHI,dist*M.FALL_EXP);
      // DITHER is card-only: breaks up banding the PNG would otherwise show.
      const o=(Math.min(M.OP_CAP,(M.OP_BASE+M.OP_LAMBERT*lam)*falloff)+rand(0,DITHER)).toFixed(3);
      inner+=`<polygon points="${poly(a,b,cc)}" fill="currentColor" fill-opacity="${o}"/>`;
      if(lam>M.HI_LAMBERT_MIN&&falloff>M.HI_FALL_MIN){ const hi=((lam-M.HI_LAMBERT_MIN)*M.HI_SCALE*falloff).toFixed(3);
        inner+=`<polygon points="${poly(a,b,cc)}" fill="#f5f5f5" fill-opacity="${hi}"/>`; } } } }
  document.getElementById('mesh').innerHTML=
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
</script>
</body>
</html>
