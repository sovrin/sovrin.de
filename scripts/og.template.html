<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The site's wall in 1200x630: the yellow with the photo multiplied onto it,
     its blacks lifted to the page's (Site.vue .portrait), beside the dark column
     with the about line; under both, the name band in ink runs the full width
     and ends in the favicon's mark — the shape the site takes under 56rem.
     Colours are the site's (main.css --wall / --wall-ink at hue 86, aequitas'
     dark --ae-bg) written out as hex. scripts/og.sh injects the Geist faces from
     aequitas' dist and a <base> at the repo root, so the photo path below
     resolves; text in .name / .about is replaced from app.config.ts. */
  :root { --wall:#f7be1c; --ink:#130f06; --bg:#0b0906; --fg:#f2efe9; --muted:#b3ada3; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  .card { display:grid; grid-template-columns:458px 1fr; grid-template-rows:1fr auto;
          width:1200px; height:630px; font-family:'Geist', system-ui, sans-serif; color:var(--fg); }
  .shot { grid-area:1/1; position:relative; min-height:0; background:var(--wall); isolation:isolate; }
  .shot img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 84%;
              filter:grayscale(1) contrast(1.15); mix-blend-mode:multiply; }
  .shot::after { content:''; position:absolute; inset:0; background:var(--bg); mix-blend-mode:lighten; }
  .name { grid-area:2/1; padding:28px 40px 40px; background:var(--wall); font-size:68px; font-weight:700;
          letter-spacing:-.055em; line-height:.92; color:var(--ink); }
  .side { grid-area:1/2; padding:64px 64px 52px; }
  .about { font-size:36px; line-height:1.32; letter-spacing:-.015em; color:var(--muted); }
  .band { grid-area:2/2; display:grid; justify-content:end; align-content:end; padding:0 40px 40px;
          background:var(--wall); }
</style>
</head>
<body>
  <div class="card">
    <div class="shot"><img src="app/assets/me.jpg" alt=""></div>
    <div class="name">Oleg Kamlowski</div>
    <div class="side">
      <div class="about">Senior software engineer at Thomann.io. In my own time I build small, sharp tools.</div>
    </div>
    <!-- public/favicon.svg's mark, without its tile: the band is the tile. -->
    <div class="band">
      <svg viewBox="0 0 32 32" width="132" height="132">
        <g transform="translate(16 16) scale(0.88) translate(-16.9 -16)" fill="#130f06">
          <circle cx="10" cy="16" r="5.6" fill="none" stroke="#130f06" stroke-width="3.6"/>
          <path d="M18.2 8.5h3.6v15h-3.6z M21.4 15.2l5.4-6.7h4.4l-6.2 7.5 6.4 7.5h-4.5l-5.5-6.7z"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
