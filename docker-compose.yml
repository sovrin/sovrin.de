services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        aequitas: ../aequitas/dist
    image: sovrin-de
    container_name: sovrin-de
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # From .env next to this file; unauthenticated, the server's IP shares GitHub's 60/h limit.
      NUXT_GITHUB_TOKEN: ${NUXT_GITHUB_TOKEN:-}
    volumes:
      - ./content:/app/content:ro
